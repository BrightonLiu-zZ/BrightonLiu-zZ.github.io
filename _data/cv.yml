- title: Projects
  type: time_table
  contents:
    - title: <a href="/projects/0_stellar_ssl/">Self-Supervised Learning on Stellar Light Curves</a>
      year: 2026 - Now
      description:
        - First author, with Y. Ma and Prof. C. Theissen (UCSD). Paper accepted at ML4PS @ NeurIPS 2026.
        - Pre-trained a convolutional encoder with a GRU latent-prediction objective (PyTorch) on unlabelled TESS light curves; froze it and evaluated the embeddings with linear probes on 10 downstream tasks.
        - Concatenated the embeddings with 25 engineered features, improving linear-probe results on 7 of 10 tasks and beating a Conv1D and an MLP trained end-to-end; multi-seed experiments with bootstrap confidence intervals, tracked with Weights & Biases.
    - title: <a href="/projects/1_katago_llm/">KataGo × LLM — LLM Post-Training & Edge Deployment</a>
      year: 2025 - Now
      description:
        - "Project lead of a volunteer team. Post-trained Qwen3-8B (LoRA, Hugging Face TRL, vLLM rollouts, Dockerized training) to play 9x9 Go and explain its moves by distilling the KataGo engine: GRPO first, then a rules-SFT / play-SFT / GRPO curriculum on 302k engine-verified examples; first wins vs a classical engine, zero illegal moves."
        - Built the evaluation (board-perception probe, top-k agreement, refereed engine ladder) and stabilized GRPO; removed reward hacking, countered entropy collapse with DAPO clip-higher + adaptive entropy control.
        - Deployed 4-bit GGUF (llama.cpp) on an 8 GB-VRAM GPU behind a C++ GTP proxy for the Lizzie GUI (~42.5 tok/s, 0.52 s TTFT); served base + 2 LoRA adapters from one vLLM instance to run 3 bots live on OGS. <a href="/projects/1_katago_llm/#demo-video">Demo</a>
    - title: <a href="/projects/5_astr199/">ASTR199 — Deep-Learning Inference of Stellar Parameters</a>
      year: 2026
      description:
        - With Prof. C. Theissen, UCSD.
        - Engineered a DuckDB ETL pipeline cross-matching ~1M rows across 7 photometric catalogs; built a physics-informed feature space of color indices and absolute magnitudes.
        - "Built a two-stage deep-learning pipeline that resolved multi-task training collapse with a sequential design and physics-informed features (log g R² 0.52 → 0.83)."
    - title: <a href="/projects/4_hackathon/">Breaking Barriers Hackathon (AWS × Deloitte × AT&T) — Finalist, Top 8 of 32</a>
      year: 2025
      description:
        - "Built a real-time anomaly-detection pipeline: sliding-window spatio-temporal features and an XGBoost classifier with thresholds tuned on PR-AUC for imbalanced data."
        - Served inference on AWS Lambda (under 400 ms), streaming alerts to an S3-hosted map dashboard.
    - title: <a href="/projects/2_galaxy_spectra/">PHY199 — Galaxy Spectra PCA Pipeline</a>
      year: 2025
      description:
        - With Prof. Wittman, UC Davis.
        - Automated Python/R preprocessing pipeline for 2,300+ high-dimensional spectra; PCA-based outlier filtering with scikit-learn, interpreting PC1–PC3.

